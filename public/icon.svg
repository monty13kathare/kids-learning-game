<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9F43"/>
      <stop offset="50%" stop-color="#FF5252"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEAA7"/>
      <stop offset="100%" stop-color="#FDCB6E"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Toy Blocks & Star Icon -->
  <g filter="url(#shadow)">
    <!-- Block A (Green) -->
    <rect x="80" y="240" width="150" height="150" rx="30" fill="#10B981" />
    <rect x="90" y="250" width="130" height="130" rx="20" fill="#34D399" />
    <text x="155" y="345" font-family="system-ui, sans-serif" font-weight="900" font-size="80" fill="#FFFFFF" text-anchor="middle">A</text>
    
    <!-- Block B (Blue) -->
    <rect x="250" y="240" width="150" height="150" rx="30" fill="#3B82F6" />
    <rect x="260" y="250" width="130" height="130" rx="20" fill="#60A5FA" />
    <text x="325" y="345" font-family="system-ui, sans-serif" font-weight="900" font-size="80" fill="#FFFFFF" text-anchor="middle">B</text>

    <!-- Star Trophy on top -->
    <polygon points="256,70 286,145 365,148 303,197 325,274 256,228 187,274 209,197 147,148 226,145" fill="url(#starGrad)" stroke="#E17055" stroke-width="6" stroke-linejoin="round"/>
    <!-- Cute Eyes on Star -->
    <circle cx="238" cy="180" r="8" fill="#2D3436"/>
    <circle cx="274" cy="180" r="8" fill="#2D3436"/>
    <path d="M 246 200 Q 256 212 266 200" stroke="#2D3436" stroke-width="5" stroke-linecap="round" fill="none"/>
  </g>
</svg>
